<head>

<body>
    <h1 text-align="center"><b>LOGIN FORM</b></h1>
    <form action="#" method="post" text-align="center">
        <label for="fullname">FULL NAME</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter Full Nmae" required>
        <br><br>
        <label for="Password">Password</label>
        <input type="password" max="15" min="8" required>
        <br><br>
        <label for="Email">Email</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="Address">Address</label>
        <textarea id="Address" name="Address" rows="4" cols="40" placeholder="Enter Full Address"></textarea>
        <br><bR>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        
    </form>
</body>
